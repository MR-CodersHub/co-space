<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign up for CoSpace - Join our coworking community">
    <title>Sign Up - CoSpace</title>
    <link rel="icon" type="image/png" href="../assets/brand-logo.png">
    <link rel="stylesheet" href="../src/input.css">
    <script src="../src/layout.js" defer></script>
</head>
<body class="bg-white dark:bg-slate-900">
    <a href="#main" class="sr-only focus:not-sr-only">Skip to main</a>
    
    <!-- Navigation -->
    <nav class="bg-white dark:bg-slate-900 border-b border-gray-200 dark:border-slate-800">
        <div class="container-custom flex items-center justify-between h-16">
            <a href="../" class="flex items-center gap-2 focus-ring rounded-lg px-2">
                <div class="w-8 h-8 bg-gradient-to-br from-primary to-primary-dark rounded-lg flex items-center justify-center">
                    <span class="text-white font-bold">CS</span>
                </div>
                <span class="font-heading font-bold text-xl hidden sm:block">CoSpace</span>
            </a>
            <button id="theme-toggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800 focus-ring" aria-label="Toggle dark mode">
                <svg class="w-5 h-5 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                <svg class="w-5 h-5 dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.536l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.828-2.828a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414l.707.707zm.707-7.071a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM9 4a1 1 0 011 1v1a1 1 0 11-2 0V5a1 1 0 011-1zm0 12a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm4.536-1.464a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM4 11a1 1 0 110 2 1 1 0 010-2zm0-4a1 1 0 110 2 1 1 0 010-2z" clip-rule="evenodd"></path></svg>
            </button>
        </div>
    </nav>

    <main id="main" class="min-h-screen flex items-center justify-center py-12 px-4">
        <div class="w-full max-w-md">
            <!-- Register Card -->
            <div class="card-elevated">
                <div class="text-center mb-8">
                    <h1 class="heading-h3 mb-2">Create Your Account</h1>
                    <p class="text-slate-600 dark:text-slate-400">Join CoSpace and start working smarter</p>
                </div>

                <form id="register-form" class="space-y-4" onsubmit="handleRegister(event)">
                    <!-- Full Name -->
                    <div>
                        <label for="fullname" class="block text-sm font-semibold mb-2">Full Name</label>
                        <input 
                            type="text" 
                            id="fullname" 
                            name="fullname" 
                            class="input" 
                            placeholder="John Doe" 
                            required 
                            aria-label="Full name"
                        >
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-semibold mb-2">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="input" 
                            placeholder="you@example.com" 
                            required 
                            autocomplete="email"
                            aria-label="Email address"
                        >
                    </div>

                    <!-- Company -->
                    <div>
                        <label for="company" class="block text-sm font-semibold mb-2">Company</label>
                        <input 
                            type="text" 
                            id="company" 
                            name="company" 
                            class="input" 
                            placeholder="Your Company" 
                            required 
                            aria-label="Company name"
                        >
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="password" class="block text-sm font-semibold mb-2">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="input" 
                            placeholder="••••••••" 
                            required 
                            minlength="8"
                            autocomplete="new-password"
                            aria-label="Password"
                            title="Password must be at least 8 characters"
                        >
                        <p class="text-xs text-slate-500 mt-1">At least 8 characters</p>
                    </div>

                    <!-- Confirm Password -->
                    <div>
                        <label for="confirm-password" class="block text-sm font-semibold mb-2">Confirm Password</label>
                        <input 
                            type="password" 
                            id="confirm-password" 
                            name="confirm-password" 
                            class="input" 
                            placeholder="••••••••" 
                            required 
                            aria-label="Confirm password"
                        >
                    </div>

                    <!-- Terms -->
                    <div class="flex items-start">
                        <input 
                            type="checkbox" 
                            id="terms" 
                            name="terms" 
                            class="rounded border-gray-300 mt-1"
                            required
                        >
                        <label for="terms" class="ml-2 text-sm text-slate-600 dark:text-slate-400">
                            I agree to the 
                            <a href="#" class="text-primary hover:underline">Terms of Service</a> and 
                            <a href="#" class="text-primary hover:underline">Privacy Policy</a>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-lg w-full">Create Account</button>
                </form>

                <!-- Divider -->
                <div class="my-6 relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-200 dark:border-slate-700"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white dark:bg-slate-800 text-slate-500">Or sign up with</span>
                    </div>
                </div>

                <!-- Social Sign Up -->
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <button type="button" class="btn btn-ghost border border-gray-200 dark:border-slate-700">Google</button>
                    <button type="button" class="btn btn-ghost border border-gray-200 dark:border-slate-700">Microsoft</button>
                </div>

                <!-- Login Link -->
                <div class="text-center">
                    <p class="text-slate-600 dark:text-slate-400 text-sm">
                        Already have an account? 
                        <a href="login.html" class="text-primary hover:text-primary-dark font-semibold transition-colors">Sign in</a>
                    </p>
                </div>
            </div>

            <!-- Info -->
            <div class="mt-6 text-center">
                <p class="text-xs text-slate-500">
                    <strong>Special Offer:</strong> Sign up today and get <strong>30% off</strong> your first month!
                </p>
            </div>
        </div>
    </main>

    <script>
        function handleRegister(event) {
            event.preventDefault();
            const fullname = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            // Validation
            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }
            
            if (password.length < 8) {
                alert('Password must be at least 8 characters');
                return;
            }
            
            // Save user
            localStorage.setItem('user', JSON.stringify({ fullname, email }));
            
            alert('Welcome to CoSpace! Your account has been created. Please log in.');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
