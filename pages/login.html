<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to CoSpace - Access your workspace dashboard">
    <title>Login - CoSpace</title>
    <link rel="icon" type="image/png" href="../assets/images/brand-logo.png">
    <link rel="stylesheet" href="../src/input.css">
    <script src="../src/layout.js" defer></script>
</head>
<body class="bg-white dark:bg-slate-900">
    <a href="#main" class="sr-only focus:not-sr-only">Skip to main</a>
    
    <!-- Navigation Minimal -->
    <nav class="bg-white dark:bg-slate-900 border-b border-gray-200 dark:border-slate-800">
        <div class="container-custom flex items-center justify-between h-16">
            <a href="../" class="flex items-center gap-2 focus-ring rounded-lg px-2">
                <div class="w-8 h-8 bg-gradient-to-br from-primary to-primary-dark rounded-lg flex items-center justify-center">
                    <span class="text-white font-bold">CS</span>
                </div>
                <span class="font-heading font-bold text-xl hidden sm:block">CoSpace</span>
            </a>
            <button id="theme-toggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800 focus-ring" aria-label="Toggle dark mode">
                <svg class="w-5 h-5 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                <svg class="w-5 h-5 dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.536l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.828-2.828a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414l.707.707zm.707-7.071a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM9 4a1 1 0 011 1v1a1 1 0 11-2 0V5a1 1 0 011-1zm0 12a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm4.536-1.464a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM4 11a1 1 0 110 2 1 1 0 010-2zm0-4a1 1 0 110 2 1 1 0 010-2z" clip-rule="evenodd"></path></svg>
            </button>
        </div>
    </nav>

    <main id="main" class="min-h-screen flex items-center justify-center py-12 px-4">
        <div class="w-full max-w-md">
            <!-- Login Card -->
            <div class="card-elevated">
                <div class="text-center mb-8">
                    <h1 class="heading-h3 mb-2">Welcome Back</h1>
                    <p class="text-slate-600 dark:text-slate-400">Sign in to your CoSpace account</p>
                </div>

                <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-semibold mb-2">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="input" 
                            placeholder="you@example.com" 
                            required 
                            autocomplete="email"
                            aria-label="Email address"
                        >
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="password" class="block text-sm font-semibold mb-2">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="input" 
                            placeholder="••••••••" 
                            required 
                            autocomplete="current-password"
                            aria-label="Password"
                        >
                    </div>

                    <!-- Remember Me -->
                    <div class="flex items-center">
                        <input 
                            type="checkbox" 
                            id="remember" 
                            name="remember" 
                            class="rounded border-gray-300"
                        >
                        <label for="remember" class="ml-2 text-sm text-slate-600 dark:text-slate-400">Remember me</label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-lg w-full">Sign In</button>
                </form>

                <!-- Divider -->
                <div class="my-6 relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-200 dark:border-slate-700"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white dark:bg-slate-800 text-slate-500">Or continue with</span>
                    </div>
                </div>

                <!-- Social Login -->
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <button class="btn btn-ghost border border-gray-200 dark:border-slate-700">Google</button>
                    <button class="btn btn-ghost border border-gray-200 dark:border-slate-700">Microsoft</button>
                </div>

                <!-- Forgot Password -->
                <div class="text-center mb-6">
                    <a href="#" class="text-primary hover:text-primary-dark text-sm font-semibold transition-colors">Forgot password?</a>
                </div>

                <!-- Sign Up Link -->
                <div class="text-center">
                    <p class="text-slate-600 dark:text-slate-400 text-sm">
                        Don't have an account? 
                        <a href="register.html" class="text-primary hover:text-primary-dark font-semibold transition-colors">Sign up</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                alert('Please enter your email and password');
                return;
            }
            
            // Simulate login
            localStorage.setItem('user', JSON.stringify({ email }));
            alert(`Welcome back! You're logged in as ${email}`);
            // Redirect to dashboard (create dashboard.html)
            window.location.href = 'admin-dashboard.html';
        }
    </script>
</body>
</html>
