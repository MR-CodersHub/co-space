<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Coming Soon - CoSpace">
    <title>Coming Soon - CoSpace</title>
    <link rel="icon" type="image/png" href="../assets/images/brand-logo.png">
    <link rel="stylesheet" href="../src/input.css">
    <script src="../src/layout.js" defer></script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 dark:from-slate-900 dark:to-slate-800">
    <a href="#main" class="sr-only focus:not-sr-only">Skip to main</a>
    
    <!-- Navigation -->
    <nav class="bg-white bg-opacity-80 dark:bg-slate-900 dark:bg-opacity-80 backdrop-blur-md border-b border-gray-200 dark:border-slate-800">
        <div class="container-custom flex items-center justify-between h-16">
            <a href="../" class="flex items-center gap-2 focus-ring rounded-lg px-2">
                <div class="w-8 h-8 bg-gradient-to-br from-primary to-primary-dark rounded-lg flex items-center justify-center">
                    <span class="text-white font-bold">CS</span>
                </div>
                <span class="font-heading font-bold text-xl hidden sm:block">CoSpace</span>
            </a>
            <button id="theme-toggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800 focus-ring" aria-label="Toggle dark mode">
                <svg class="w-5 h-5 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                <svg class="w-5 h-5 dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.536l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.828-2.828a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414l.707.707zm.707-7.071a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM9 4a1 1 0 011 1v1a1 1 0 11-2 0V5a1 1 0 011-1zm0 12a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm4.536-1.464a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM4 11a1 1 0 110 2 1 1 0 010-2zm0-4a1 1 0 110 2 1 1 0 010-2z" clip-rule="evenodd"></path></svg>
            </button>
        </div>
    </nav>

    <main id="main" class="min-h-screen flex items-center justify-center py-12 px-4">
        <div class="text-center max-w-2xl mx-auto">
            <!-- Icon -->
            <div class="mb-8 animate-bounce">
                <svg class="w-24 h-24 mx-auto text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>

            <!-- Content -->
            <h1 class="heading-h1 mb-4">Coming Soon</h1>
            <p class="text-xl text-slate-600 dark:text-slate-400 mb-4">
                We're working hard to bring you something amazing. Something big is coming!
            </p>
            <p class="text-lg text-slate-600 dark:text-slate-400 mb-12">
                Expected Launch: <span class="font-bold text-primary">January 2025</span>
            </p>

            <!-- Countdown Timer -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12 max-w-md mx-auto">
                <div class="card">
                    <p class="text-3xl font-bold text-primary">42</p>
                    <p class="text-sm text-slate-500">Days</p>
                </div>
                <div class="card">
                    <p class="text-3xl font-bold text-secondary">16</p>
                    <p class="text-sm text-slate-500">Hours</p>
                </div>
                <div class="card">
                    <p class="text-3xl font-bold text-accent">23</p>
                    <p class="text-sm text-slate-500">Minutes</p>
                </div>
                <div class="card">
                    <p class="text-3xl font-bold text-primary">47</p>
                    <p class="text-sm text-slate-500">Seconds</p>
                </div>
            </div>

            <!-- Newsletter Signup -->
            <div class="mb-8">
                <p class="text-slate-600 dark:text-slate-400 mb-4">Be the first to know when we launch</p>
                <form class="flex gap-2 flex-col sm:flex-row max-w-sm mx-auto" onsubmit="handleNewsletterSignup(event)">
                    <input 
                        type="email" 
                        placeholder="Enter your email" 
                        class="input flex-1" 
                        required
                        aria-label="Email address for notifications"
                    >
                    <button type="submit" class="btn btn-primary">Notify Me</button>
                </form>
                <p class="text-xs text-slate-500 mt-3">No spam, just launch updates</p>
            </div>

            <!-- Social Links -->
            <div class="flex justify-center gap-4 pt-8 border-t border-gray-200 dark:border-slate-700">
                <a href="#" class="text-slate-600 dark:text-slate-400 hover:text-primary transition-colors" title="Twitter">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M6.29 18.251c7.547 0 11.675-6.253 11.675-11.675 0-.178 0-.355-.012-.53A8.348 8.348 0 0020 3.92a8.19 8.19 0 01-2.357.646 4.118 4.118 0 001.804-2.27 8.224 8.224 0 01-2.605.996 4.107 4.107 0 00-6.993 3.743 11.65 11.65 0 01-8.457-4.287 4.106 4.106 0 001.27 5.477A4.072 4.072 0 01.8 7.713v.052a4.105 4.105 0 003.292 4.022 4.095 4.095 0 01-1.853.07 4.108 4.108 0 003.834 2.85A8.233 8.233 0 010 16.407a11.616 11.616 0 006.29 1.84"></path></svg>
                </a>
                <a href="#" class="text-slate-600 dark:text-slate-400 hover:text-primary transition-colors" title="LinkedIn">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.338 16.338H13.67V12.16c0-.995-.017-2.278-1.387-2.278-1.389 0-1.601 1.084-1.601 2.205v4.251h-2.666V9.309h2.56v1.17h.037c.357-.675 1.228-1.387 2.528-1.387 2.7 0 3.2 1.778 3.2 4.091v4.355zM5.337 8.855a1.548 1.548 0 11-.001-3.097 1.548 1.548 0 01.001 3.097zm1.333 9.483H3.667v-7.03h2.67v7.03zM17.668 1H2.328C1.595 1 1 1.581 1 2.298v15.403C1 18.418 1.595 19 2.328 19h15.34c.734 0 1.332-.582 1.332-1.299V2.298C19 1.581 18.402 1 17.668 1z" clip-rule="evenodd"></path></svg>
                </a>
                <a href="#" class="text-slate-600 dark:text-slate-400 hover:text-primary transition-colors" title="Instagram">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12.315 2c2.43 0 2.784.013 3.808.06 1.064.049 1.791.218 2.427.465a4.902 4.902 0 011.772 1.153 4.902 4.902 0 011.153 1.772c.247.636.416 1.363.465 2.427.048 1.067.06 1.407.06 4.123v.08c0 2.643-.012 2.987-.06 4.043-.049 1.064-.218 1.791-.465 2.427a4.902 4.902 0 01-1.153 1.772 4.902 4.902 0 01-1.772 1.153c-.636.247-1.363.416-2.427.465-1.067.048-1.407.06-4.123.06h-.08c-2.643 0-2.987-.012-4.043-.06-1.064-.049-1.791-.218-2.427-.465a4.902 4.902 0 01-1.772-1.153 4.902 4.902 0 01-1.153-1.772c-.247-.636-.416-1.363-.465-2.427-.047-1.024-.06-1.379-.06-3.808v-.63c0-2.43.013-2.784.06-3.808.049-1.064.218-1.791.465-2.427a4.902 4.902 0 011.153-1.772A4.902 4.902 0 015.45 2.525c.636-.247 1.363-.416 2.427-.465C8.901 2.013 9.256 2 11.685 2h.63zm-.081 1.802h-.468c-2.456 0-2.784.011-3.807.058-.975.045-1.504.207-1.857.344-.466.182-.8.398-1.15.748-.35.35-.566.684-.748 1.15-.137.353-.3.882-.344 1.857-.047 1.023-.058 1.351-.058 3.807v.468c0 2.456.011 2.784.058 3.807.045.975.207 1.504.344 1.857.182.466.398.8.748 1.15.35.35.684.566 1.15.748.353.137.882.3 1.857.344 1.054.048 1.37.058 4.041.058h.08c2.597 0 2.917-.01 3.96-.058.976-.045 1.505-.207 1.858-.344.466-.182.8-.398 1.15-.748.35-.35.566-.684.748-1.15.137-.353.3-.882.344-1.857.048-1.055.058-1.37.058-4.041v-.08c0-2.597-.01-2.917-.058-3.96-.045-.976-.207-1.505-.344-1.858a3.097 3.097 0 00-.748-1.15 3.098 3.098 0 00-1.15-.748c-.353-.137-.882-.3-1.857-.344-1.023-.047-1.351-.058-3.807-.058zM12 6.865a3.135 3.135 0 110 6.27 3.135 3.135 0 010-6.27zm0 1.802a1.333 1.333 0 100 2.666 1.333 1.333 0 000-2.666zm5.338-3.205a.75.75 0 110 1.5.75.75 0 010-1.5z" clip-rule="evenodd"></path></svg>
                </a>
            </div>
        </div>
    </main>

    <script>
        function handleNewsletterSignup(event) {
            event.preventDefault();
            const email = event.target.querySelector('input[type="email"]').value;
            alert(`Thank you! We've registered ${email} for launch notifications.`);
            event.target.reset();
        }
    </script>
</body>
</html>
